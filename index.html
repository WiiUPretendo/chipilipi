<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Webhook Sender</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #2c2f33;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #23272a;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        h1 {
            color: #7289da;
        }
        textarea {
            width: 100%;
            height: 100px;
            margin-bottom: 10px;
            border: none;
            border-radius: 5px;
            padding: 10px;
            font-size: 14px;
            resize: none;
        }
        button {
            background-color: #7289da;
            color: #ffffff;
            border: none;
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #5b6eae;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Send to Discord</h1>
        <textarea id="message" placeholder="Type your message here..."></textarea>
        <button onclick="sendToWebhook()">Send</button>
        <p id="status" style="margin-top: 10px;"></p>
    </div>

    <script>
        async function sendToWebhook() {
            const webhookUrl = "https://discord.com/api/webhooks/1329158004570066997/u5nAJ3qZUXuT_aVjMWJ2f1A4Wz8Fu12M56rvpVi2pfDimwWBq9DZp2daMajVA76kkBX4"; // Replace with your webhook URL
            const message = document.getElementById("message").value;
            const status = document.getElementById("status");

            if (!message) {
                status.style.color = "red";
                status.textContent = "Message cannot be empty.";
                return;
            }

            try {
                const response = await fetch(webhookUrl, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        content: message
                    })
                });

                if (response.ok) {
                    status.style.color = "green";
                    status.textContent = "Message sent successfully!";
                    document.getElementById("message").value = "";
                } else {
                    status.style.color = "red";
                    status.textContent = "Failed to send message. Check the webhook URL.";
                }
            } catch (error) {
                status.style.color = "red";
                status.textContent = "An error occurred while sending the message.";
                console.error(error);
            }
        }
    </script>
</body>
</html>
